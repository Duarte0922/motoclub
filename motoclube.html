<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central dos Moto Clubes — Listagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0908;
  --black-soft:#161210;
  --charcoal:#1f1a16;
  --card:#221c18;
  --leather:#2b221c;
  --cream:#f2e9db;
  --smoke:#b3a89a;
  --red:#e2231a;
  --orange:#ff8c1a;
  --flame: linear-gradient(100deg, var(--red), var(--orange));
  --line: rgba(242,233,219,.10);
  --line-strong: rgba(242,233,219,.22);
  --display:'Anton',sans-serif;
  --body:'Inter',sans-serif;
  --tag:'Oswald',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--cream);font-family:var(--body);line-height:1.5;position:relative;}
.page-grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(115deg, transparent 0 60px, rgba(242,233,219,.6) 60px 61px, transparent 61px 130px),
    repeating-linear-gradient(25deg, transparent 0 90px, rgba(0,0,0,.5) 90px 91px, transparent 91px 170px);}
.page-vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;
  box-shadow:inset 0 0 180px 40px rgba(0,0,0,.75);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.eyebrow{font-family:var(--tag);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);font-weight:600;display:inline-flex;align-items:center;gap:.6rem;}
.eyebrow::before{content:'';width:26px;height:2px;background:var(--flame);display:inline-block;}
h1,h2{font-family:var(--display);text-transform:uppercase;font-weight:400;letter-spacing:.01em;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 6vw;border-bottom:1px solid var(--line);}
.topbar-logo{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-size:1.1rem;}
.topbar-logo svg{width:30px;height:30px;flex-shrink:0;}
.topbar-logo span:last-child{color:var(--orange);}
.voltar{font-family:var(--tag);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line-strong);padding:.6rem 1.1rem;border-radius:3px;}
.voltar:hover{border-color:var(--orange);color:var(--orange);}

.section{padding:3.5rem 6vw;max-width:1200px;margin:0 auto;}
.section h1{font-size:clamp(1.9rem,5vw,3rem);margin-top:.5rem;}
.section-sub{color:var(--smoke);margin-top:.6rem;}

.clubes-grid{display:grid;grid-template-columns:1fr;gap:1.4rem;margin-top:2.4rem;}
.patch-card{background:var(--card);border:1px solid var(--line);padding:2rem 1.4rem 1.6rem;text-align:center;transition:border-color .25s, transform .25s;cursor:pointer;}
.patch-card:hover{border-color:var(--orange);transform:translateY(-4px);}
.patch-badge{width:100px;height:100px;border-radius:50%;margin:0 auto .3rem;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, #3a2a20, var(--leather));
  border:3px double var(--line-strong);
  box-shadow:0 0 0 3px var(--black-soft), 0 4px 10px rgba(0,0,0,.5), inset 0 0 14px rgba(0,0,0,.6);}
.patch-badge::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1.5px dashed var(--orange);opacity:.55;}
.patch-badge .emoji{font-size:2.3rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.patch-ribbon{display:inline-block;background:var(--flame);color:#1a0e08;font-family:var(--tag);font-size:.62rem;font-weight:700;letter-spacing:.1em;padding:.2rem .7rem;border-radius:2px;transform:rotate(-2deg);box-shadow:0 2px 4px rgba(0,0,0,.4);margin-bottom:.7rem;}
.patch-card h3{font-family:var(--tag);font-size:1.1rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.patch-card span{color:var(--smoke);font-size:.82rem;display:block;margin-top:.3rem;}
@media(min-width:640px){.clubes-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.clubes-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}}

.vazio{color:var(--smoke);padding:3rem 0;text-align:center;font-family:var(--tag);text-transform:uppercase;letter-spacing:.03em;}

.clube-modal-overlay{position:fixed;inset:0;background:rgba(10,9,8,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:6vw;}
.clube-modal-overlay.open{display:flex;}
.clube-modal{background:var(--card);border:1px solid var(--line-strong);max-width:420px;width:100%;padding:2.4rem 2rem;text-align:center;position:relative;}
.clube-modal-close{position:absolute;top:.8rem;right:.8rem;font-size:1.4rem;color:var(--smoke);}
.clube-modal .patch-badge{margin-bottom:1.2rem;}
.clube-modal h3{font-family:var(--tag);font-size:1.3rem;text-transform:uppercase;font-weight:600;margin-bottom:.3rem;}
.clube-modal .local{color:var(--smoke);font-size:.9rem;margin-bottom:1.4rem;display:block;}
</style>
</head>
<body>
<div class="page-grain"></div>
<div class="page-vignette"></div>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="22" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M18 20c0-2 2-4 6-4s6 2 6 4-2 3-2 5-1 4-4 4-4-2-4-4-2-3-2-5z" fill="currentColor"/>
      <path d="M6 18c4-4 9-5 12-3M42 18c-4-4-9-5-12-3" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>CENTRAL DOS MOTOCLUBES</span>
  </div>
  <a href="motoclubes.html" class="voltar">← Voltar ao início</a>
</div>

<div class="section">
  <span class="eyebrow" id="tipoEyebrow">Categoria</span>
  <h1 id="tipoTitulo">Motoclubes</h1>
  <p class="section-sub" id="tipoSub">Todos os cadastros nessa categoria.</p>

  <div class="clubes-grid" id="clubesGrid"></div>
  <p class="vazio" id="vazioMsg" style="display:none;">Nenhum cadastro nessa categoria ainda — em breve.</p>
</div>

<div class="clube-modal-overlay" id="clubeModalOverlay">
  <div class="clube-modal">
    <button class="clube-modal-close" id="clubeModalClose" aria-label="Fechar">✕</button>
    <div class="patch-badge"><span class="emoji" id="clubeModalBadge"></span></div>
    <span class="patch-ribbon">MC</span>
    <h3 id="clubeModalNome"></h3>
    <span class="local" id="clubeModalLocal"></span>
    <p style="color:var(--smoke);font-size:.85rem;">Perfil completo (fotos, contato e história) chega assim que o cadastro real do motoclube estiver integrado.</p>
  </div>
</div>

<script>
// Mesma base de dados da home — quando o Firestore entrar, isso vira um fetch()
// e as duas páginas (home e esta) passam a ler do mesmo lugar.
const CLUBES = [
  { tipo: 'motoclube', nome: 'Lobos do Asfalto MC', local: 'Belo Horizonte, MG', emoji: '💀' },
  { tipo: 'motoclube', nome: 'Falcões do Reino MC', local: 'Uberlândia, MG', emoji: '🦅' },
  { tipo: 'motoclube', nome: 'Alcateia MC', local: 'São Paulo, SP', emoji: '🐺' },
  { tipo: 'motoclube', nome: 'Asfalto Livre MC', local: 'Porto Alegre, RS', emoji: '🔥' },
  { tipo: 'motoclube', nome: 'Ferro & Fogo MC', local: 'Contagem, MG', emoji: '⚙️' },
];

const TIPO_LABELS = {
  motoclube: 'Motoclubes',
  grupo: 'Moto Grupos',
  viajante: 'Moto Viajantes',
  casal: 'Moto Casais',
};

const params = new URLSearchParams(window.location.search);
const tipo = params.get('tipo') || 'motoclube';
const label = TIPO_LABELS[tipo] || 'Motoclubes';

document.getElementById('tipoEyebrow').textContent = label;
document.getElementById('tipoTitulo').textContent = label + ' em destaque';
document.title = 'Central dos Moto Clubes — ' + label;

const grid = document.getElementById('clubesGrid');
const vazioMsg = document.getElementById('vazioMsg');
const filtrados = CLUBES.filter(c => c.tipo === tipo);

if (filtrados.length === 0) {
  vazioMsg.style.display = 'block';
} else {
  filtrados.forEach(c => {
    const card = document.createElement('div');
    card.className = 'patch-card';
    card.dataset.nome = c.nome;
    card.dataset.local = c.local;
    card.dataset.emoji = c.emoji;
    card.innerHTML = `<div class="patch-badge"><span class="emoji">${c.emoji}</span></div><span class="patch-ribbon">MC</span><h3>${c.nome}</h3><span>${c.local}</span>`;
    grid.appendChild(card);
  });
}

const clubeModalOverlay = document.getElementById('clubeModalOverlay');
const clubeModalBadge = document.getElementById('clubeModalBadge');
const clubeModalNome = document.getElementById('clubeModalNome');
const clubeModalLocal = document.getElementById('clubeModalLocal');
document.querySelectorAll('.patch-card').forEach(card => {
  card.addEventListener('click', () => {
    clubeModalBadge.textContent = card.dataset.emoji;
    clubeModalNome.textContent = card.dataset.nome;
    clubeModalLocal.textContent = card.dataset.local;
    clubeModalOverlay.classList.add('open');
  });
});
document.getElementById('clubeModalClose').addEventListener('click', () => clubeModalOverlay.classList.remove('open'));
clubeModalOverlay.addEventListener('click', (e) => { if (e.target === clubeModalOverlay) clubeModalOverlay.classList.remove('open'); });
</script>
</body>
</html>
