<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Motoclube — Central dos Moto Clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0908;
  --black-soft:#151212;
  --card:#1c1817;
  --cream:#f2e9db;
  --smoke:#b3a89a;
  --red:#c31f1f;
  --red-deep:#8f1414;
  --line: rgba(242,233,219,.12);
  --line-strong: rgba(242,233,219,.24);
  --display:'Anton',sans-serif;
  --body:'Inter',sans-serif;
  --tag:'Oswald',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--cream);font-family:var(--body);line-height:1.5;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
img,svg{display:block;max-width:100%;}
h1,h2{font-family:var(--display);text-transform:uppercase;font-weight:400;line-height:1;letter-spacing:.01em;}
.divider{height:3px;background:linear-gradient(90deg, transparent, var(--red) 15%, var(--red) 85%, transparent);}

.nav{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 6vw;background:var(--black-soft);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:1rem;}
.nav-logo{display:flex;align-items:center;gap:.7rem;}
.nav-logo svg{width:46px;height:46px;flex-shrink:0;}
.nav-logo .word{display:flex;flex-direction:column;line-height:1;font-family:var(--display);}
.nav-logo .word span:first-child{font-size:.8rem;letter-spacing:.15em;color:var(--smoke);}
.nav-logo .word span:last-child{font-size:1.3rem;}
.nav-links{display:none;gap:1.8rem;align-items:center;}
.nav-links a{font-family:var(--body);font-size:.95rem;font-weight:500;color:var(--cream);opacity:.85;}
.nav-links a:hover{opacity:1;color:var(--red);}
.nav-links a.active{opacity:1;color:var(--red);}
@media(min-width:920px){.nav-links{display:flex;}}

.wrap{max-width:640px;margin:0 auto;padding:3rem 6vw 5rem;}
.wrap h1{font-size:clamp(1.9rem,5vw,2.6rem);margin-bottom:.6rem;}
.wrap > p{color:var(--smoke);margin-bottom:2.2rem;}

.field{margin-bottom:1.3rem;}
.field label{display:block;font-family:var(--tag);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--smoke);margin-bottom:.5rem;}
.field input[type="text"],
.field input[type="tel"],
.field select,
.field textarea{
  width:100%;padding:.85rem 1rem;background:var(--card);border:1px solid var(--line-strong);
  border-radius:6px;color:var(--cream);font-size:.95rem;font-family:inherit;
}
.field textarea{resize:vertical;min-height:90px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media(max-width:560px){.row2{grid-template-columns:1fr;}}

.logo-upload{display:flex;align-items:center;gap:1.2rem;}
.logo-preview{
  width:88px;height:88px;border-radius:50%;background:var(--card);border:2px dashed var(--line-strong);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--smoke);font-size:.7rem;text-align:center;
}
.logo-preview img{width:100%;height:100%;object-fit:cover;}
.file-btn{display:inline-block;padding:.75rem 1.3rem;background:var(--card);border:1px solid var(--line-strong);border-radius:6px;font-size:.88rem;}
.file-btn:hover{border-color:var(--red);}
input[type="file"]{display:none;}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:1rem 1.8rem;font-weight:700;font-size:.95rem;border-radius:6px;width:100%;transition:transform .2s, opacity .2s;}
.btn-red{background:var(--red);color:var(--cream);}
.btn-red:hover{transform:translateY(-2px);}
.btn-red:disabled{opacity:.55;transform:none;cursor:not-allowed;}

.msg{margin-top:1.2rem;padding:1rem 1.2rem;border-radius:6px;font-size:.9rem;display:none;}
.msg.ok{display:block;background:rgba(63,191,111,.12);border:1px solid rgba(63,191,111,.4);color:#7fd89a;}
.msg.err{display:block;background:rgba(195,31,31,.12);border:1px solid rgba(195,31,31,.4);color:#f0a6a6;}

footer{padding:2.2rem 6vw;border-top:1px solid var(--line);text-align:center;color:var(--smoke);font-size:.85rem;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <svg viewBox="0 0 60 60" fill="none">
      <path d="M30 6 L36 16 L48 12 L44 24 L54 30 L44 36 L48 48 L36 44 L30 54 L24 44 L12 48 L16 36 L6 30 L16 24 L12 12 L24 16 Z" fill="none" stroke="var(--cream)" stroke-width="1.5"/>
      <path d="M18 24c5-5 14-6 19-4M42 24c-5-5-14-6-19-4" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="7" fill="none" stroke="var(--cream)" stroke-width="1.5"/>
      <path d="M26 29c0-2 1.5-3 4-3s4 1 4 3-1.5 2-1.5 3.5S31.5 34 30 34s-2.5-.5-2.5-1.5S26 31 26 29z" fill="var(--red)"/>
    </svg>
    <div class="word"><span>CENTRAL</span><span>CENTRAL DOS MOTOCLUBES</span></div>
  </div>
  <div class="nav-links">
    <a href="index.html">Início</a>
    <a href="motoclubes.html">Motoclubes</a>
    <a href="mapa-biker.html">Mapa Biker</a>
    <a href="cadastro.html" class="active">Cadastrar</a>
  </div>
</nav>
<div class="divider"></div>

<div class="wrap">
  <h1>Cadastre seu Motoclube</h1>
  <p>Preencha os dados abaixo. Seu cadastro passa por uma revisão antes de aparecer no site.</p>

  <form id="form-cadastro">
    <div class="field">
      <label>Logo do Motoclube *</label>
      <div class="logo-upload">
        <div class="logo-preview" id="logo-preview">sem logo</div>
        <label class="file-btn" for="logo-input">Escolher imagem</label>
        <input type="file" id="logo-input" accept="image/*" required>
      </div>
    </div>

    <div class="field">
      <label>Nome do Motoclube *</label>
      <input type="text" id="nome" required>
    </div>

    <div class="row2">
      <div class="field">
        <label>Tipo *</label>
        <select id="tipo" required>
          <option value="">Selecione</option>
          <option value="motoclube">Motoclube</option>
          <option value="grupo">Moto Grupo</option>
          <option value="viajante">Moto Viajante</option>
          <option value="casal">Moto Casal</option>
        </select>
      </div>
      <div class="field">
        <label>Estado *</label>
        <select id="estado" required>
          <option value="">UF</option>
          <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
          <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
          <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
          <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
          <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
          <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
          <option>SP</option><option>SE</option><option>TO</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Cidade *</label>
      <input type="text" id="cidade" required>
    </div>

    <div class="field">
      <label>Endereço (sede / ponto de encontro)</label>
      <input type="text" id="endereco">
    </div>

    <div class="row2">
      <div class="field">
        <label>WhatsApp *</label>
        <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" required>
      </div>
      <div class="field">
        <label>Instagram</label>
        <input type="text" id="instagram" placeholder="@seuclube">
      </div>
    </div>

    <div class="field">
      <label>Sobre o motoclube</label>
      <textarea id="descricao" placeholder="Fundação, propósito, tipo de moto, etc."></textarea>
    </div>

    <button type="submit" class="btn btn-red" id="btn-enviar">Enviar Cadastro</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<footer>
  © 2026 Central dos Moto Clubes — Conectando motociclistas de todo o Brasil.
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWJxiCRdR7bwQil6MineZUclcA3I4l6yU",
  authDomain: "motoclubs-9469c.firebaseapp.com",
  projectId: "motoclubs-9469c",
  storageBucket: "motoclubs-9469c.firebasestorage.app",
  messagingSenderId: "1044550010096",
  appId: "1:1044550010096:web:feda4da9dd7bd17dbb2e35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const logoInput = document.getElementById('logo-input');
const logoPreview = document.getElementById('logo-preview');
let logoFile = null;

logoInput.addEventListener('change', () => {
  const file = logoInput.files[0];
  if (!file) return;
  logoFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    logoPreview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
  };
  reader.readAsDataURL(file);
});

const form = document.getElementById('form-cadastro');
const btn = document.getElementById('btn-enviar');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.textContent = '';

  if (!logoFile) {
    msg.className = 'msg err';
    msg.textContent = 'Selecione a logo do motoclube.';
    return;
  }

  const dados = {
    nome: document.getElementById('nome').value.trim(),
    tipo: document.getElementById('tipo').value,
    estado: document.getElementById('estado').value,
    cidade: document.getElementById('cidade').value.trim(),
    endereco: document.getElementById('endereco').value.trim(),
    whatsapp: document.getElementById('whatsapp').value.trim(),
    instagram: document.getElementById('instagram').value.trim(),
    descricao: document.getElementById('descricao').value.trim()
  };

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const nomeArquivo = `${Date.now()}_${logoFile.name}`;
    const storageRef = ref(storage, `logos/${nomeArquivo}`);
    await uploadBytes(storageRef, logoFile);
    const logoUrl = await getDownloadURL(storageRef);

    await addDoc(collection(db, 'motoclubes'), {
      ...dados,
      logoUrl,
      status: 'pendente',
      criadoEm: serverTimestamp()
    });

    msg.className = 'msg ok';
    msg.textContent = 'Cadastro enviado! Ele vai passar por revisão antes de aparecer no site.';
    form.reset();
    logoPreview.innerHTML = 'sem logo';
    logoFile = null;
    btn.textContent = 'Enviar Cadastro';
  } catch (err) {
    console.error(err);
    msg.className = 'msg err';
    msg.textContent = 'Erro ao enviar. Tente novamente em instantes.';
    btn.textContent = 'Enviar Cadastro';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
