<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motoclube — Central dos Moto Clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0908;
  --black-soft:#151212;
  --card:#1c1817;
  --cream:#f2e9db;
  --smoke:#b3a89a;
  --red:#c31f1f;
  --green:#25D366;
  --line: rgba(242,233,219,.12);
  --line-strong: rgba(242,233,219,.24);
  --display:'Anton',sans-serif;
  --body:'Inter',sans-serif;
  --tag:'Oswald',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--cream);font-family:var(--body);line-height:1.5;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
img,svg{display:block;max-width:100%;}
h1,h2{font-family:var(--display);text-transform:uppercase;font-weight:400;line-height:1;letter-spacing:.01em;}
.divider{height:3px;background:linear-gradient(90deg, transparent, var(--red) 15%, var(--red) 85%, transparent);}

.nav{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 6vw;background:var(--black-soft);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:1rem;}
.nav-logo{display:flex;align-items:center;gap:.7rem;}
.nav-logo svg{width:46px;height:46px;flex-shrink:0;}
.nav-logo .word{display:flex;flex-direction:column;line-height:1;font-family:var(--display);}
.nav-logo .word span:first-child{font-size:.8rem;letter-spacing:.15em;color:var(--smoke);}
.nav-logo .word span:last-child{font-size:1.3rem;}
.nav-links{display:none;gap:1.8rem;align-items:center;}
.nav-links a{font-family:var(--body);font-size:.95rem;font-weight:500;color:var(--cream);opacity:.85;}
.nav-links a:hover{opacity:1;color:var(--red);}
@media(min-width:920px){.nav-links{display:flex;}}

.wrap{max-width:680px;margin:0 auto;padding:3rem 6vw 5rem;}
.voltar{display:inline-block;margin-bottom:1.6rem;color:var(--smoke);font-size:.88rem;}
.voltar:hover{color:var(--red);}

.perfil-topo{text-align:center;margin-bottom:2rem;}
.perfil-logo{width:132px;height:132px;border-radius:50%;overflow:hidden;background:var(--card);border:3px solid var(--red);margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:center;}
.perfil-logo img{width:100%;height:100%;object-fit:cover;}
.perfil-topo h1{font-size:clamp(1.7rem,5vw,2.4rem);}
.perfil-topo .loc{color:var(--smoke);margin-top:.5rem;font-size:.95rem;}
.tag{display:inline-block;font-family:var(--tag);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--red);background:rgba(195,31,31,.12);border:1px solid rgba(195,31,31,.3);padding:.3rem .8rem;border-radius:20px;margin-top:.8rem;}

.info-card{background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:1.6rem;margin-bottom:1.2rem;}
.info-card h3{font-family:var(--tag);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--smoke);margin-bottom:.7rem;}
.info-card p{font-size:.95rem;}
.info-row{display:flex;gap:.7rem;align-items:flex-start;margin-bottom:.9rem;}
.info-row:last-child{margin-bottom:0;}
.info-row svg{flex-shrink:0;color:var(--red);margin-top:.2rem;}
.info-row span{font-size:.92rem;color:var(--cream);}

.acoes{display:flex;flex-direction:column;gap:.9rem;margin-top:1.8rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:1rem 1.8rem;font-weight:700;font-size:.95rem;border-radius:8px;width:100%;transition:transform .2s;}
.btn:hover{transform:translateY(-2px);}
.btn-whats{background:var(--green);color:#06210f;}
.btn-insta{background:var(--card);border:1px solid var(--line-strong);color:var(--cream);}

.carregando, .erro{text-align:center;color:var(--smoke);padding:4rem 0;}

footer{padding:2.2rem 6vw;border-top:1px solid var(--line);text-align:center;color:var(--smoke);font-size:.85rem;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <svg viewBox="0 0 60 60" fill="none">
      <path d="M30 6 L36 16 L48 12 L44 24 L54 30 L44 36 L48 48 L36 44 L30 54 L24 44 L12 48 L16 36 L6 30 L16 24 L12 12 L24 16 Z" fill="none" stroke="var(--cream)" stroke-width="1.5"/>
      <path d="M18 24c5-5 14-6 19-4M42 24c-5-5-14-6-19-4" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="7" fill="none" stroke="var(--cream)" stroke-width="1.5"/>
      <path d="M26 29c0-2 1.5-3 4-3s4 1 4 3-1.5 2-1.5 3.5S31.5 34 30 34s-2.5-.5-2.5-1.5S26 31 26 29z" fill="var(--red)"/>
    </svg>
    <div class="word"><span>CENTRAL</span><span>CENTRAL DOS MOTOCLUBES</span></div>
  </div>
  <div class="nav-links">
    <a href="index.html">Início</a>
    <a href="motoclubes.html">Motoclubes</a>
    <a href="mapa-biker.html">Mapa Biker</a>
    <a href="cadastro.html">Cadastrar</a>
  </div>
</nav>
<div class="divider"></div>

<div class="wrap" id="wrap">
  <div class="carregando" id="carregando">Carregando...</div>
</div>

<footer>
  © 2026 Central dos Moto Clubes — Conectando motociclistas de todo o Brasil.
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWJxiCRdR7bwQil6MineZUclcA3I4l6yU",
  authDomain: "motoclubs-9469c.firebaseapp.com",
  projectId: "motoclubs-9469c",
  storageBucket: "motoclubs-9469c.firebasestorage.app",
  messagingSenderId: "1044550010096",
  appId: "1:1044550010096:web:feda4da9dd7bd17dbb2e35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TAG_POR_TIPO = {
  motoclube: 'Moto Clube',
  grupo: 'Moto Grupo',
  viajante: 'Moto Viajante',
  casal: 'Moto Casal'
};

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function linkWhatsapp(raw){
  const digitos = (raw || '').replace(/\D/g, '');
  if (!digitos) return null;
  const comPais = digitos.startsWith('55') ? digitos : '55' + digitos;
  return `https://wa.me/${comPais}`;
}

function linkInstagram(raw){
  if (!raw) return null;
  const usuario = raw.trim().replace(/^@/, '');
  if (!usuario) return null;
  return `https://instagram.com/${usuario}`;
}

function svgIcon(path){
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${path}</svg>`;
}

async function carrega(){
  const wrap = document.getElementById('wrap');
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    wrap.innerHTML = '<div class="erro">Motoclube não encontrado. <a href="motoclubes.html" style="color:var(--red);">Voltar à lista</a></div>';
    return;
  }

  try {
    const snap = await getDoc(doc(db, 'motoclubes', id));

    if (!snap.exists() || snap.data().status !== 'aprovado') {
      wrap.innerHTML = '<div class="erro">Motoclube não encontrado. <a href="motoclubes.html" style="color:var(--red);">Voltar à lista</a></div>';
      return;
    }

    const c = snap.data();
    const loc = [c.cidade, c.estado].filter(Boolean).join(', ');
    const tag = TAG_POR_TIPO[c.tipo] || 'Motoclube';
    const whatsUrl = linkWhatsapp(c.whatsapp);
    const instaUrl = linkInstagram(c.instagram);

    let html = `
      <a href="motoclubes.html" class="voltar">← Voltar aos motoclubes</a>

      <div class="perfil-topo">
        <div class="perfil-logo"><img src="${c.logoUrl}" alt="${escapeHtml(c.nome)}"></div>
        <h1>${escapeHtml(c.nome)}</h1>
        <div class="loc">${escapeHtml(loc)}</div>
        <span class="tag">${escapeHtml(tag)}</span>
      </div>
    `;

    if (c.descricao) {
      html += `
        <div class="info-card">
          <h3>Sobre o motoclube</h3>
          <p>${escapeHtml(c.descricao)}</p>
        </div>
      `;
    }

    html += `<div class="info-card">
      <h3>Informações</h3>`;

    if (loc) {
      html += `<div class="info-row">${svgIcon('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>')}<span>${escapeHtml(loc)}</span></div>`;
    }
    if (c.endereco) {
      html += `<div class="info-row">${svgIcon('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>')}<span>${escapeHtml(c.endereco)}</span></div>`;
    }
    if (c.whatsapp) {
      html += `<div class="info-row">${svgIcon('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>')}<span>${escapeHtml(c.whatsapp)}</span></div>`;
    }
    if (c.instagram) {
      html += `<div class="info-row">${svgIcon('<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>')}<span>${escapeHtml(c.instagram)}</span></div>`;
    }

    html += `</div>`;

    html += `<div class="acoes">`;
    if (whatsUrl) {
      html += `<a href="${whatsUrl}" target="_blank" rel="noopener" class="btn btn-whats">${svgIcon('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>')} Chamar no WhatsApp</a>`;
    }
    if (instaUrl) {
      html += `<a href="${instaUrl}" target="_blank" rel="noopener" class="btn btn-insta">${svgIcon('<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>')} Ver no Instagram</a>`;
    }
    html += `</div>`;

    wrap.innerHTML = html;
  } catch (err) {
    console.error(err);
    wrap.innerHTML = '<div class="erro">Erro ao carregar o motoclube. Tente novamente.</div>';
  }
}

carrega();
</script>
</body>
</html>
